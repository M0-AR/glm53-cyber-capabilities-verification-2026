services:
  analysis:
    build: .
    container_name: glm53-verification
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./figures:/workspace/figures
    ports:
      - "8888:8888"
    environment:
      - PYTHONUNBUFFERED=1
      - MPLBACKEND=Agg
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --token=glm53
